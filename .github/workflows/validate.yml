name: Validate Claude Plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.310"

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: solibo-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate package contract
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          jq -e '
            .name == "solibo-home" and
            .displayName == "Solibo Home" and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            .homepage == "https://mcp.solibo.no" and
            .repository == "https://github.com/Solibo-AS/solibo-home-claude-plugin" and
            .defaultEnabled == false and
            .mcpServers == "./.mcp.json"
          ' .claude-plugin/plugin.json
          jq -e '
            (.mcpServers | keys) == ["solibo-home"] and
            .mcpServers["solibo-home"].type == "http" and
            .mcpServers["solibo-home"].url == "https://mcp.home.solibo.no" and
            (.mcpServers["solibo-home"] | has("headers") | not) and
            (.mcpServers["solibo-home"] | has("env") | not)
          ' .mcp.json
          grep -Fq "## [${VERSION}]" CHANGELOG.md

      - name: Validate with Claude Code
        run: >-
          npx --yes
          @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}
          plugin validate . --strict
